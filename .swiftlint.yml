# SwiftLint Configuration for NewsFlow
# iOS 15.0+ | Swift/SwiftUI | Portrait | Universal

excluded:
  - NewsFlowTests
  - NewsFlowUITests
  - DerivedData
  - ".build"
  - "*.generated.swift"
  - NewsFlow/Core/Localization/L10n.swift

included:
  - NewsFlow

# Disabled rules that conflict with SwiftUI idioms or project conventions
disabled_rules:
  - trailing_whitespace
  - vertical_whitespace_opening_braces
  - vertical_whitespace_closing_braces
  - vertical_whitespace_between_cases
  - multiple_trailing_closures
  - explicit_acl          # SwiftUI files don't need explicit ACL
  - explicit_top_level_acl
  - object_literal        # SwiftUI asset catalog colors trigger false positives
  - nslocalizedstring_key # L10n helper uses dynamic keys intentionally
  - number_separator      # 1024*1024 style math is more readable without underscores
  - switch_case_on_newline # SwiftUI commonly uses compact case statements

# Opt-in rules for higher code quality
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - expiring_todo
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - ibinspectable_in_extension
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - nimble_operator
  - nslocalizedstring_key
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strict_fileprivate
  - strong_iboutlet
  - switch_case_on_newline
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_between_cases
  - xct_specific_matcher
  - yoda_condition

# Line length: generous for SwiftUI view builders
line_length:
  warning: 140
  error: 180

# File length
file_length:
  warning: 500
  error: 800

# Type body length
type_body_length:
  warning: 400
  error: 600

# Function body length
function_body_length:
  warning: 80
  error: 120

# Cyclomatic complexity
cyclomatic_complexity:
  warning: 12
  error: 20

# Nesting
nesting:
  type_level:
    warning: 3

# Analyzer rules (only run via `swiftlint analyze`)
analyzer_rules:
  - unused_declaration
  - unused_import

# Identifier naming
identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - x
    - y
    - i
    - j
    - k
    - n
    - vm
    - ui
    - up
    - ok
  allowed_symbols:
    - "_"

# Type naming
type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60

# Reporter
reporter: "xcode"
